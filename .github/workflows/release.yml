name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run release:build
        env:
          AUTOCANVAS_VERSION: ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: canvas-mcp-${{ matrix.os }}
          path: release/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
      AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package Firefox extension
        run: |
          pnpm run extension:build
          mkdir -p release-assets
          (cd browser-extension/dist-firefox && zip -r ../../release-assets/canvas-firefox-extension.zip . -x "*.DS_Store")
      - name: Sign Firefox extension (AMO)
        if: ${{ env.AMO_API_KEY != '' && env.AMO_API_SECRET != '' }}
        run: |
          if pnpm dlx web-ext@10 sign \
              --source-dir browser-extension/dist-firefox \
              --channel unlisted \
              --api-key "$AMO_API_KEY" \
              --api-secret "$AMO_API_SECRET"; then
            ls -la web-ext-artifacts/
            cp web-ext-artifacts/*.xpi release-assets/canvas-firefox-signed.xpi
          else
            echo "::warning::AMO signing failed; shipping binaries without a signed xpi."
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect binaries
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec cp -p {} release-assets/ \;
          ls -la release-assets/
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
